name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build & Test Microservice (Java 25)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Zulu)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle and run tests
        run: ./gradlew build --no-daemon

      - name: Build Jib OCI/Docker container image (daemonless tarball)
        run: ./gradlew jibBuildTar --no-daemon

      - name: Verify build and container artifacts
        run: |
          echo "Built JAR artifacts in build/libs:"
          ls -lh build/libs/
          echo "Built Jib container tarball in build/:"
          ls -lh build/jib-image.tar

      - name: Upload Application JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail-sender-jar
          path: build/libs/*-all*.jar
          retention-days: 7

      - name: Publish Container Image to GHCR via Jib
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Publishing Jib container to GHCR: ${IMAGE_LOWER}:latest and ${IMAGE_LOWER}:${{ github.sha }}"
          ./gradlew jib --no-daemon \
            -Djib.to.image="${IMAGE_LOWER}:latest" \
            -Djib.to.tags="${{ github.sha }}" \
            -Djib.to.auth.username="${{ github.actor }}" \
            -Djib.to.auth.password="${{ secrets.GITHUB_TOKEN }}"

  test-scripts:
    name: Test Customer IT Guide Generator (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run IT Handover script tests
        run: |
          chmod +x scripts/generate_customer_guide.py
          
          # Test 1: Subdomain setup
          ./scripts/generate_customer_guide.py \
            --domain mail.example.com \
            --customer "Example Corp" \
            --service "Automated Notification System" \
            --output-dir /tmp/guide-subdomain
            
          test -f /tmp/guide-subdomain/DNS_Setup_Guide_mail_example_com.pdf
          test -f /tmp/guide-subdomain/DNS_Setup_Guide_mail_example_com.md

          # Test 2: Apex domain with existing SPF merge
          ./scripts/generate_customer_guide.py \
            --domain example.com \
            --customer "Example Corp" \
            --existing-spf "include:spf.protection.outlook.com" \
            --output-dir /tmp/guide-apex

          test -f /tmp/guide-apex/DNS_Setup_Guide_example_com.pdf
          test -f /tmp/guide-apex/DNS_Setup_Guide_example_com.md

  docker-build:
    name: Build & Verify Docker Container
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dockerfile,enable={{is_default_branch}}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
